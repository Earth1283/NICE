[workspace]
resolver = "2"
members = ["crates/nicer-proto", "crates/nicer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Earth1283/NICE"

[workspace.dependencies]
nicer-proto = { path = "crates/nicer-proto" }
nicer = { path = "crates/nicer" }

anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
blake3 = "1.5"
bytes = "1.7"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
mdns-sd = "0.13"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-pki-types = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = { version = "0.16", features = ["verify"] }

[profile.release]
lto = "thin"
strip = true
